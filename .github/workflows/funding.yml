name: Funding news

on:
  schedule:
    - cron: "30 3 * * *" # 08:30 Asia/Karachi
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (no database writes)
        type: boolean
        default: false

# Never two runs of the same source at once; a late scheduled run waits.
concurrency:
  group: source-funding
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    uses: ./.github/workflows/run-source.yml
    with:
      source: funding
      dry_run: ${{ inputs.dry_run || false }}
    secrets: inherit
