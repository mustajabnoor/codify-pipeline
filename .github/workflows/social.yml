name: Social listening

on:
  schedule:
    # Every 4 hours at :17 (04:17, 08:17, ... Asia/Karachi). Off the hour
    # because GitHub delays on-the-hour schedules the most.
    - cron: "17 */4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (no database writes)
        type: boolean
        default: false

# Never two runs of the same source at once; a late scheduled run waits.
concurrency:
  group: source-social
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    uses: ./.github/workflows/run-source.yml
    with:
      source: social
      dry_run: ${{ inputs.dry_run || false }}
    secrets: inherit
